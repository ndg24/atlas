[project]
name = "atlas-sdk"
version = "0.1.0"
description = "Python client for Atlas's coordinator REST API -- notebook-style SQL/NL querying, insights, and research reports"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # only needed to exercise QueryResult.to_pandas() in tests -- the SDK
    # itself imports pandas lazily and works fine without it installed.
    "pandas>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_sdk"]
