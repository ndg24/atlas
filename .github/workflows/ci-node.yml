name: ci-node

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/ci-node.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/ci-node.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build
