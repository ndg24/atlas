# pgvector/pgvector:pg16 -- postgres:16 plus the pgvector extension
# pre-installed, needed for corpus_documents' `vector` column
# (coordinator/internal/catalog/migrations/0008_corpus_documents.up.sql,
# Phase 8 literature retrieval). Same image docker-compose.yml uses.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: atlas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: atlas
spec:
  replicas: 1
  strategy:
    type: Recreate # a single ReadWriteOnce volume can't be double-mounted during a rolling update
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: atlas-secrets }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "atlas", "-d", "atlas"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "atlas", "-d", "atlas"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: atlas
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
