# Scrapes the /metrics endpoints coordinator, catalog, every worker, and
# the ai-service expose -- same set deploy/prometheus.yml scrapes for
# docker-compose, targets rewritten to k8s Service DNS names (the worker
# StatefulSet's headless Service gives each replica a stable name; a
# job-level static target list is simplest here, matching the compose file
# exactly, over standing up prometheus-operator's ServiceMonitor CRDs for a
# 3-node worker fleet).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: atlas
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: coordinator
        static_configs:
          - targets: ["coordinator:8080"]

      - job_name: catalog
        static_configs:
          - targets: ["catalog:9095"]

      - job_name: atlas-workers
        static_configs:
          - targets: ["worker-0.worker:9101", "worker-1.worker:9101", "worker-2.worker:9101"]

      - job_name: ai-service
        static_configs:
          - targets: ["ai-service:9096"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          readinessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: atlas
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
