# Result cache (Phase 4) -- ephemeral by design (coordinator/internal/cache
# treats a cache miss as a normal, correct outcome), so no PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: atlas
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
