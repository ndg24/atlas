# Local model runtime for the ai-service's ollama provider (Phase 6 task 7)
# -- the first-class, no-API-key path. `ollama-models` persists pulled
# models across restarts; pull one with e.g.
# `kubectl exec -n atlas deploy/ollama -- ollama pull llama3` (and
# `ollama pull nomic-embed-text` for Phase 8 literature embeddings) before
# pointing ATLAS_LLM_MODEL/ATLAS_EMBEDDING_MODEL at it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: atlas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: atlas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            tcpSocket: { port: 11434 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 11434 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "2", memory: "6Gi" }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: atlas
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
