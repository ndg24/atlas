# Dev-only defaults, same values deploy/docker-compose.yml hardcodes for
# local dev -- every value here MUST be overridden for a real deployment
# (e.g. `kubectl create secret generic atlas-secrets --dry-run=client -o yaml
# --from-literal=JWT_SECRET=... --from-literal=POSTGRES_PASSWORD=... ...
# --namespace atlas | kubectl apply -f -`, or a sealed-secrets/external-secrets
# pipeline in front of this manifest). JWT_SECRET in particular has no
# code-level fallback (coordinator/cmd/coordinator/main.go) -- the
# coordinator refuses to start without one, on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: atlas-secrets
  namespace: atlas
type: Opaque
stringData:
  JWT_SECRET: "dev-insecure-secret-change-me"
  POSTGRES_USER: "atlas"
  POSTGRES_PASSWORD: "atlas"
  POSTGRES_DB: "atlas"
  MINIO_ROOT_USER: "atlas"
  MINIO_ROOT_PASSWORD: "atlas-minio"
